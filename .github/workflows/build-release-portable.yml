name: Build release APK (portable signing)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Build release APK
        # release buildType enables isMinifyEnabled + isShrinkResources,
        # and keeps the official applicationId (no ".debug" suffix).
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing with repository secrets."
            echo "$KEYSTORE_B64" | base64 --decode > /tmp/release.jks
            alias="$KEY_ALIAS"
            storepass="$STORE_PASSWORD"
            keypass="$KEY_PASSWORD"
          else
            echo "Signing secrets unavailable - generating a temporary self-signed keystore."
            alias="ci"
            storepass="translateyou-ci"
            keypass="translateyou-ci"
            keytool -genkeypair -v \
              -keystore /tmp/release.jks \
              -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$storepass" -keypass "$keypass" \
              -dname "CN=TranslateYou CI, OU=CI, O=TranslateYou, L=Unknown, ST=Unknown, C=US" \
              > /dev/null
            echo "::notice::Using a throwaway signature. This APK cannot update an app signed with the official keystore."
          fi

          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks /tmp/release.jks \
            --ks-key-alias "$alias" \
            --ks-pass "pass:$storepass" \
            --key-pass "pass:$keypass" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"

          AAPT=$(find "$SDK_ROOT/build-tools" -type f -path '*/aapt' | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            PKG=$("$AAPT" dump badging "$SIGNED" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            echo "Package name: $PKG"
            if [ "$PKG" != "com.bnyro.translate" ]; then
              echo "::error::Unexpected package name: $PKG"
              exit 1
            fi
          else
            echo "::warning::aapt not found; skipped package name verification"
          fi

          rm -f /tmp/release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-portable
          path: app-release.apk
          if-no-files-found: error
